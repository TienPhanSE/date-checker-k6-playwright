name: CI/CD Pipeline - Date Checker

on:
  push:
    branches: [ main, master, CICDtest ]
  pull_request:
    branches: [ main, master, CICDtest ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. Kéo mã nguồn repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Cài đặt môi trường Node.js (v18)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # 3. Cài đặt các thư viện từ package-lock.json
      - name: Install dependencies
        run: npm ci

      # 4. Cài đặt trình duyệt Playwright Chromium
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      # 5. Chạy Playwright E2E Tests
      - name: Run Playwright E2E Tests
        run: npm run test:e2e

      # 6. Thiết lập K6
      - name: Setup K6
        uses: grafana/setup-k6-action@v1

      # 7. Khởi động server API và chạy K6 Load Test
      - name: Run K6 Load Test
        run: |
          npm run api &
          sleep 3
          k6 run --duration 10s tests/performance/load.js
