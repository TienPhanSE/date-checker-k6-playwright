name: CI/CD Pipeline - Date Checker

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    # 1. Kéo mã nguồn dự án về máy chủ ảo (runner)
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Cài đặt môi trường Node.js (phiên bản 18)
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    # 3. Cài đặt các gói phụ thuộc (dependencies) từ package-lock.json
    - name: Install dependencies
      run: npm ci

    # 4. Cài đặt trình duyệt cho Playwright (dành cho E2E test)
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    # 5. Chạy tập lệnh kiểm thử Playwright E2E
    - name: Run Playwright E2E Tests
      run: npx playwright test

    # 6. Thiết lập công cụ K6 (dành cho Performance/Load test)
    - name: Setup K6
      uses: grafana/setup-k6-action@v1

    # 7. Chạy kịch bản kiểm thử tải K6
    # (Lưu ý: Thay thế 'load-test.js' bằng đường dẫn thực tế tới file k6 của bạn nếu có)
    - name: Run K6 Load Test
      run: k6 run load-test.js